{{- if and .Values.secrets.externalSecret.enabled (not .Values.secrets.existingSecret) }}
{{- /*
  External Secrets Operator pulls the raw credentials from AWS Secrets Manager / Azure Key Vault and assembles the
  Secret the pods consume. Passwords never appear in Git, Helm values or the Helm release object.
  The ESO template placeholders are escaped with backticks so Helm leaves them alone.
*/ -}}
{{- $es := .Values.secrets.externalSecret }}
{{- $full := include "sentinelops.fullname" . }}
{{- $refs := $es.remoteRefs }}
{{- $store := required "secrets.externalSecret.secretStoreRef.name is required" $es.secretStoreRef.name }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "sentinelops.secretName" . }}
  labels:
    {{- include "sentinelops.labels" (dict "root" . "component" "secrets") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $store }}
  target:
    name: {{ include "sentinelops.secretName" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        POSTGRES_PASSWORD: {{ `"{{ .pgPassword }}"` }}
        POSTGRES_DSN: {{ printf `"postgresql://sentinel:{{ .pgPassword }}@%s-postgres:5432/sentinel"` $full }}
        RABBITMQ_DEFAULT_PASS: {{ `"{{ .mqPassword }}"` }}
        AMQP_URL: {{ printf `"amqp://sentinel:{{ .mqPassword }}@%s-rabbitmq:5672/"` $full }}
        API_KEYS: {{ `"{{ .apiKeys }}"` }}
        INGEST_API_KEY: {{ `"{{ .apiKeys | splitList \",\" | first | trim }}"` }}
        WEBHOOK_URL: {{ if $refs.webhookUrl }}{{ `"{{ .webhookUrl }}"` }}{{ else }}""{{ end }}
  data:
    - secretKey: pgPassword
      remoteRef: {key: {{ $refs.postgresPassword | quote }}}
    - secretKey: mqPassword
      remoteRef: {key: {{ $refs.rabbitmqPassword | quote }}}
    - secretKey: apiKeys
      remoteRef: {key: {{ $refs.apiKeys | quote }}}
    {{- if $refs.webhookUrl }}
    - secretKey: webhookUrl
      remoteRef: {key: {{ $refs.webhookUrl | quote }}}
    {{- end }}
{{- end }}
