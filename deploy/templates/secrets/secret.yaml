{{- if and (not .Values.secrets.existingSecret) (not .Values.secrets.externalSecret.enabled) }}
{{- /* Dev/test path only. Refuse empty values and the old placeholder defaults so they can never reach a cluster. */ -}}
{{- $pg := required "secrets.postgresPassword is required (or use secrets.existingSecret / secrets.externalSecret.enabled)" .Values.secrets.postgresPassword }}
{{- $mq := required "secrets.rabbitmqPassword is required (or use secrets.existingSecret / secrets.externalSecret.enabled)" .Values.secrets.rabbitmqPassword }}
{{- $keys := required "secrets.apiKeys is required (or use secrets.existingSecret / secrets.externalSecret.enabled)" .Values.secrets.apiKeys }}
{{- range $v := list $pg $mq $keys }}
{{- if or (hasPrefix "change-me" $v) (hasPrefix "changeme" $v) }}
{{- fail "placeholder secret values (change-me*) are not allowed - generate real credentials (openssl rand -hex 16)" }}
{{- end }}
{{- end }}
{{- $full := include "sentinelops.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinelops.secretName" . }}
  labels:
    {{- include "sentinelops.labels" (dict "root" . "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pg | quote }}
  POSTGRES_DSN: {{ printf "postgresql://sentinel:%s@%s-postgres:5432/sentinel" $pg $full | quote }}
  RABBITMQ_DEFAULT_PASS: {{ $mq | quote }}
  AMQP_URL: {{ printf "amqp://sentinel:%s@%s-rabbitmq:5672/" $mq $full | quote }}
  API_KEYS: {{ $keys | quote }}
  INGEST_API_KEY: {{ index (splitList "," $keys) 0 | trim | quote }}
  WEBHOOK_URL: {{ .Values.secrets.webhookUrl | quote }}
{{- end }}
