{{- if .Values.networkPolicy.enabled }}
{{- /*
  Least-privilege ingress: every pod of the release is default-denied, then each backend only accepts traffic from the
  components that really use it (derived from the code: ingest->redis+rabbitmq, processor->postgres+redis+rabbitmq,
  alert->postgres+redis+rabbitmq, query->postgres+redis, filebeat->logstash->elasticsearch<-kibana).
  Public services additionally accept the Envoy Gateway data-plane; Prometheus may scrape metrics ports.
*/ -}}
{{- $full := include "sentinelops.fullname" . }}
{{- $gw := .Values.networkPolicy.gatewayNamespace }}
{{- $mon := .Values.networkPolicy.monitoringNamespace }}
{{- $exp := and .Values.monitoring.enabled .Values.monitoring.exporters.enabled }}
{{- $rules := list }}
{{- $ingestFrom := list }}
{{- if .Values.loadgen.enabled }}{{ $ingestFrom = list "loadgen" }}{{ end }}
{{- $rules = append $rules (dict "to" "ingest-api" "pods" $ingestFrom "podPorts" (list 8000) "gwPorts" (list 8000) "monPorts" (list 8000)) }}
{{- $rules = append $rules (dict "to" "query-api" "pods" (list) "podPorts" (list) "gwPorts" (list 8000) "monPorts" (list 8000)) }}
{{- $rules = append $rules (dict "to" "processor" "pods" (list) "podPorts" (list) "gwPorts" (list) "monPorts" (list 8000)) }}
{{- $rules = append $rules (dict "to" "alert-service" "pods" (list) "podPorts" (list) "gwPorts" (list) "monPorts" (list 8000)) }}
{{- if .Values.loadgen.enabled }}
{{- $rules = append $rules (dict "to" "loadgen" "pods" (list) "podPorts" (list) "gwPorts" (list) "monPorts" (list 8000)) }}
{{- end }}
{{- $redisMon := list }}{{ if $exp }}{{ $redisMon = list 9121 }}{{ end }}
{{- $mqMon := list }}{{ if $exp }}{{ $mqMon = list 15692 }}{{ end }}
{{- $rules = append $rules (dict "to" "redis" "pods" (list "ingest-api" "processor" "alert-service" "query-api") "podPorts" (list 6379) "gwPorts" (list) "monPorts" $redisMon) }}
{{- $rules = append $rules (dict "to" "rabbitmq" "pods" (list "ingest-api" "processor" "alert-service") "podPorts" (list 5672) "gwPorts" (list) "monPorts" $mqMon) }}
{{- $rules = append $rules (dict "to" "postgres" "pods" (list "processor" "alert-service" "query-api") "podPorts" (list 5432) "gwPorts" (list) "monPorts" (list)) }}
{{- if .Values.elk.enabled }}
{{- $esFrom := list "logstash" "kibana" "elk-bootstrap" }}
{{- if $exp }}{{ $esFrom = append $esFrom "es-exporter" }}{{ end }}
{{- $kbGw := list }}{{ if .Values.elk.kibana.expose }}{{ $kbGw = list 5601 }}{{ end }}
{{- $rules = append $rules (dict "to" "elasticsearch" "pods" $esFrom "podPorts" (list 9200) "gwPorts" (list) "monPorts" (list)) }}
{{- $rules = append $rules (dict "to" "kibana" "pods" (list "elk-bootstrap") "podPorts" (list 5601) "gwPorts" $kbGw "monPorts" (list)) }}
{{- $rules = append $rules (dict "to" "logstash" "pods" (list "filebeat") "podPorts" (list 5044) "gwPorts" (list) "monPorts" (list)) }}
{{- if $exp }}
{{- $rules = append $rules (dict "to" "es-exporter" "pods" (list) "podPorts" (list) "gwPorts" (list) "monPorts" (list 9114)) }}
{{- end }}
{{- end }}
# 1) default-deny ingress for every pod of this release
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
---
{{- range $r := $rules }}
# allow -> {{ $r.to }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-allow-{{ $r.to }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $r.to }}
  policyTypes: [Ingress]
  ingress:
    {{- if $r.pods }}
    - from:
        {{- range $r.pods }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: {{ . }}
        {{- end }}
      ports:
        {{- range $r.podPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
    {{- if $r.gwPorts }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $gw }}
      ports:
        {{- range $r.gwPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
    {{- if $r.monPorts }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $mon }}
      ports:
        {{- range $r.monPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
---
{{- end }}
{{- end }}
