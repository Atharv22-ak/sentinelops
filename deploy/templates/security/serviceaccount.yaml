{{- if .Values.serviceAccount.create }}
{{- /* Dedicated ServiceAccount per component instead of the namespace "default" one. Names match the workloads. */ -}}
{{- $full := include "sentinelops.fullname" . }}
{{- $comps := list "ingest-api" "processor" "alert-service" "query-api" "postgres" "redis" "rabbitmq" }}
{{- if .Values.loadgen.enabled }}{{ $comps = append $comps "loadgen" }}{{ end }}
{{- if .Values.elk.enabled }}{{ $comps = concat $comps (list "elasticsearch" "kibana" "logstash" "elk-bootstrap") }}{{ end }}
{{- if and .Values.monitoring.enabled .Values.monitoring.exporters.enabled .Values.elk.enabled }}{{ $comps = append $comps "es-exporter" }}{{ end }}
{{- range $comp := $comps }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-{{ $comp }}
  labels:
    {{- include "sentinelops.labels" (dict "root" $ "component" $comp) | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
{{- end }}
