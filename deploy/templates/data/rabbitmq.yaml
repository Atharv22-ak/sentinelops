{{- $full := include "sentinelops.fullname" . }}
{{- $ctx := dict "root" . "component" "rabbitmq" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-rabbitmq
  labels:
    {{- include "sentinelops.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "sentinelops.selectorLabels" $ctx | nindent 4 }}
  ports:
    - {name: amqp, port: 5672}
    - {name: management, port: 15672}
    {{- if and .Values.monitoring.enabled .Values.monitoring.exporters.enabled }}
    - {name: prometheus, port: 15692}
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $full }}-rabbitmq
  labels:
    {{- include "sentinelops.labels" $ctx | nindent 4 }}
spec:
  serviceName: {{ $full }}-rabbitmq
  replicas: 1
  selector:
    matchLabels:
      {{- include "sentinelops.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sentinelops.labels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sentinelops.serviceAccountName" (dict "root" . "component" "rabbitmq") }}
      automountServiceAccountToken: false
      {{- include "sentinelops.imagePullSecrets" . | nindent 6 }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          # Official image starts as root, chowns /var/lib/rabbitmq and drops to the rabbitmq user (fsGroup is avoided:
          # it makes the Erlang cookie group-readable and RabbitMQ then refuses to start).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
            {{- if and .Values.monitoring.enabled .Values.monitoring.exporters.enabled }}
            - {name: prometheus, containerPort: 15692}
            {{- end }}
          env:
            - {name: RABBITMQ_DEFAULT_USER, value: sentinel}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinelops.secretName" . }}
                  key: RABBITMQ_DEFAULT_PASS
          readinessProbe:
            exec: {command: ["rabbitmq-diagnostics", "-q", "ping"]}
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec: {command: ["rabbitmq-diagnostics", "-q", "ping"]}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
            {{- if and .Values.monitoring.enabled .Values.monitoring.exporters.enabled }}
            - {name: plugins, mountPath: /etc/rabbitmq/enabled_plugins, subPath: enabled_plugins, readOnly: true}
            {{- end }}
      {{- if and .Values.monitoring.enabled .Values.monitoring.exporters.enabled }}
      volumes:
        - name: plugins
          configMap:
            name: {{ $full }}-rabbitmq-plugins
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "sentinelops.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.rabbitmq.storage }}
{{- if and .Values.monitoring.enabled .Values.monitoring.exporters.enabled }}
---
# Enables the built-in Prometheus endpoint (:15692/metrics) next to the management UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-rabbitmq-plugins
  labels:
    {{- include "sentinelops.labels" $ctx | nindent 4 }}
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus].
{{- end }}
