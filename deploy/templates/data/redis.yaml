{{- $full := include "sentinelops.fullname" . }}
{{- $ctx := dict "root" . "component" "redis" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-redis
  labels:
    {{- include "sentinelops.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "sentinelops.selectorLabels" $ctx | nindent 4 }}
  ports:
    - {name: redis, port: 6379}
    {{- if and .Values.monitoring.enabled .Values.monitoring.exporters.enabled }}
    - {name: metrics, port: 9121}
    {{- end }}
---
# Redis holds only rebuildable state (rate limits, sliding windows, baselines, caches), so no persistence.
# volatile-lru evicts only keys that have a TTL (buckets/caches) and never the detector baselines.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-redis
  labels:
    {{- include "sentinelops.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sentinelops.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sentinelops.labels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sentinelops.serviceAccountName" (dict "root" . "component" "redis") }}
      automountServiceAccountToken: false
      {{- include "sentinelops.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "{{ .Values.redis.maxMemory }}", "--maxmemory-policy", "volatile-lru"]
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
        {{- if and .Values.monitoring.enabled .Values.monitoring.exporters.enabled }}
        - name: exporter
          image: {{ .Values.monitoring.exporters.redisImage }}
          args: ["--redis.addr=redis://localhost:6379"]
          ports:
            - {name: metrics, containerPort: 9121}
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 59000
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 100m, memory: 64Mi}
        {{- end }}
      volumes:
        - name: data
          emptyDir: {}
