{{- $full := include "sentinelops.fullname" . }}
{{- $ctx := dict "root" . "component" "postgres" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-postgres
  labels:
    {{- include "sentinelops.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "sentinelops.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: pg
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $full }}-postgres
  labels:
    {{- include "sentinelops.labels" $ctx | nindent 4 }}
spec:
  serviceName: {{ $full }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "sentinelops.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sentinelops.labels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sentinelops.serviceAccountName" (dict "root" . "component" "postgres") }}
      automountServiceAccountToken: false
      {{- include "sentinelops.imagePullSecrets" . | nindent 6 }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          # The official image starts as root, fixes ownership of PGDATA and drops to the postgres user, so it needs
          # these few capabilities. Everything else is dropped. (fsGroup is avoided: it makes PGDATA group-writable
          # and PostgreSQL refuses to start on a data directory with such permissions.)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
          args: ["-c", "shared_buffers=96MB", "-c", "max_connections=100"]
          ports:
            - name: pg
              containerPort: 5432
          env:
            - {name: POSTGRES_DB, value: sentinel}
            - {name: POSTGRES_USER, value: sentinel}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinelops.secretName" . }}
                  key: POSTGRES_PASSWORD
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "sentinel", "-d", "sentinel"]}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "sentinel", "-d", "sentinel"]}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "sentinelops.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
