{{- if .Values.gateway.enabled }}
{{- $full := include "sentinelops.fullname" . }}
{{- $routes := list (dict "name" "dashboard" "sub" .Values.gateway.hosts.dashboard "svc" "query-api" "port" 8000) (dict "name" "ingest" "sub" .Values.gateway.hosts.ingest "svc" "ingest-api" "port" 8000) }}
{{- if and .Values.elk.enabled .Values.elk.kibana.expose }}
{{- $routes = append $routes (dict "name" "kibana" "sub" .Values.gateway.hosts.kibana "svc" "kibana" "port" 5601) }}
{{- end }}
{{- range $r := $routes }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $full }}-{{ $r.name }}
  labels:
    {{- include "sentinelops.labels" (dict "root" $ "component" "gateway") | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
  hostnames:
    - {{ include "sentinelops.host" (dict "root" $ "sub" $r.sub) | quote }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ $full }}-{{ $r.svc }}
          port: {{ $r.port }}
---
{{- end }}
{{- end }}
