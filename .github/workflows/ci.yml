name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check services tests scripts
      - run: python -m pytest -q

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/
      - name: render (ELK off)
        run: helm template t deploy/ -n sentinelops > /tmp/off.yaml
      - name: render (ELK on)
        run: helm template t deploy/ -n sentinelops --set elk.enabled=true > /tmp/on.yaml
      - name: validate manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -ignore-missing-schemas -summary /tmp/off.yaml /tmp/on.yaml

  images:
    if: github.ref == 'refs/heads/main'
    needs: [test, helm]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ingest_api, processor, alert_service, query_api, loadgen]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: name
        run: echo "image=$(echo '${{ matrix.service }}' | tr _ -)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sentinelops-${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/sentinelops-${{ steps.name.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
